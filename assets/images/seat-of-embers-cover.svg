<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Seat of Embers cover</title>
  <desc id="desc">A fantasy cover with glowing blue crystal, sword, ember flames, and gold title text.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#050d3d"/>
      <stop offset="40%" stop-color="#101f6a"/>
      <stop offset="100%" stop-color="#18040d"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#9fe2ff" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#5eb8ff" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#224dcb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b133d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9756" stop-opacity="0.9"/>
      <stop offset="28%" stop-color="#ff4b2b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#23060d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4e8ba"/>
      <stop offset="28%" stop-color="#e8d18d"/>
      <stop offset="52%" stop-color="#d4ac5d"/>
      <stop offset="72%" stop-color="#f5e4ba"/>
      <stop offset="100%" stop-color="#b88438"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" x2="1">
      <stop offset="0%" stop-color="#d9f7ff"/>
      <stop offset="40%" stop-color="#91d1f4"/>
      <stop offset="100%" stop-color="#a9ceec"/>
    </linearGradient>
    <linearGradient id="bladeEdge" x1="0" x2="1">
      <stop offset="0%" stop-color="#f7ffff"/>
      <stop offset="100%" stop-color="#8ed7ff"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1200" height="1800" fill="url(#bg)"/>

  <g opacity="0.9">
    <circle cx="600" cy="640" r="420" fill="url(#glowBlue)"/>
    <circle cx="600" cy="960" r="440" fill="url(#glowRed)"/>
  </g>

  <g opacity="0.55">
    <g fill="#d7f2ff">
      <circle cx="120" cy="140" r="2.5"/>
      <circle cx="240" cy="180" r="2.2"/>
      <circle cx="920" cy="160" r="3"/>
      <circle cx="1080" cy="230" r="2.4"/>
      <circle cx="850" cy="280" r="2.4"/>
      <circle cx="180" cy="390" r="2.2"/>
      <circle cx="340" cy="240" r="2.6"/>
      <circle cx="1020" cy="420" r="2.8"/>
      <circle cx="760" cy="480" r="2.4"/>
      <circle cx="600" cy="200" r="2.4"/>
      <circle cx="450" cy="120" r="2.3"/>
      <circle cx="1070" cy="950" r="2.8"/>
      <circle cx="170" cy="930" r="2.8"/>
      <circle cx="900" cy="1030" r="3.2"/>
      <circle cx="740" cy="1200" r="2.5"/>
      <circle cx="340" cy="1220" r="2.7"/>
    </g>
    <g fill="#b34afd" opacity="0.8">
      <circle cx="240" cy="420" r="3"/>
      <circle cx="420" cy="510" r="3.2"/>
      <circle cx="820" cy="500" r="3.1"/>
      <circle cx="980" cy="720" r="3.4"/>
      <circle cx="180" cy="760" r="3"/>
      <circle cx="890" cy="1370" r="2.7"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M145 1060 C 520 820, 550 700, 600 480" stroke="#6cd0ff" stroke-width="12" opacity="0.8"/>
    <path d="M1000 1020 C 650 800, 610 700, 600 480" stroke="#6cd0ff" stroke-width="12" opacity="0.8"/>
  </g>

  <g transform="translate(0,20)">
    <g transform="translate(160 310) rotate(-6 220 450)">
      <path d="M145 40 C 140 100, 140 180, 170 320 L 230 320 C 255 170, 257 100, 255 40 Z" fill="url(#blade)" opacity="0.95"/>
      <path d="M152 2 L 246 2 C 254 20, 258 32, 262 50 L 257 130 C 254 150, 248 164, 240 182 L 245 310 L 152 310 L 158 182 C 147 164, 142 150, 138 130 L 134 50 C 138 32, 142 20, 152 2 Z" fill="url(#bladeEdge)" opacity="0.72"/>
      <path d="M118 205 L 282 205 L 298 450 L 102 450 Z" fill="url(#blade)" opacity="0.75"/>
      <path d="M96 450 L 302 450 L 286 500 L 126 500 Z" fill="#d4e7fb" opacity="0.85"/>
      <path d="M105 500 L 295 500 L 270 540 L 130 540 Z" fill="#0d1832" stroke="#b4d7f0" stroke-width="6"/>
      <path d="M132 505 L 268 505 L 290 540 L 118 540 Z" fill="#1c2948"/>
      <path d="M118 170 L 282 170 L 290 210 L 110 210 Z" fill="#5ac2ff" opacity="0.2"/>
      <g fill="#d0efff" opacity="0.9">
        <path d="M140 34 C 175 12, 215 12, 248 34 L 220 62 L 208 118 L 176 118 L 170 60 Z"/>
      </g>
      <g fill="#0b1228" stroke="#cfe7ff" stroke-width="4">
        <path d="M84 310 C 98 282, 108 256, 112 220 L 142 220 L 138 300 L 120 340 Z"/>
        <path d="M298 310 C 284 282, 274 256, 270 220 L 240 220 L 244 300 L 264 340 Z"/>
      </g>
      <g fill="#09182c" stroke="#cfe7ff" stroke-width="3">
        <path d="M110 210 L 288 210 L 260 246 L 138 246 Z"/>
        <path d="M200 0 L 242 0 L 256 22 L 188 22 Z" fill="#d8f6ff"/>
      </g>
      <g fill="#d8f1ff" stroke="#b9e4ff" stroke-width="3">
        <path d="M154 64 L 238 64 L 226 108 L 166 108 Z"/>
      </g>
    </g>

    <g transform="translate(570 320) rotate(10 200 360)">
      <path d="M200 60 L 255 52 L 276 198 L 198 200 Z" fill="#d7f4ff" opacity="0.9"/>
      <path d="M200 60 L 255 52 L 276 198 L 198 200 Z" fill="url(#blade)" opacity="0.9"/>
      <path d="M150 88 L 282 88 L 302 142 L 170 142 Z" fill="url(#blade)" opacity="0.92"/>
      <path d="M95 160 L 358 160 L 355 520 L 98 520 Z" fill="url(#blade)" opacity="0.8"/>
      <path d="M112 520 L 342 520 L 326 596 L 128 596 Z" fill="#0e1728" stroke="#d3f0ff" stroke-width="7"/>
      <path d="M120 590 L 334 590 L 312 668 L 140 668 Z" fill="#101b37"/>
      <path d="M136 182 L 319 182 L 330 223 L 124 223 Z" fill="#80d3ff" opacity="0.18"/>
      <path d="M154 60 C 170 18, 196 8, 226 6 C 255 8, 262 20, 282 42 L 252 104 L 188 108 Z" fill="#d7f6ff" opacity="0.95"/>
      <path d="M176 140 L 280 140 L 330 230 L 214 230 Z" fill="#d1f0ff" opacity="0.75"/>
    </g>

    <g transform="translate(640 390) rotate(8 260 220)">
      <g filter="url(#softGlow)">
        <path d="M300 40 L 430 180 L 350 350 L 220 300 L 180 150 Z" fill="#7de6ff" opacity="0.95"/>
        <path d="M300 40 L 430 180 L 350 350 L 220 300 L 180 150 Z" fill="url(#bg)" opacity="0.2"/>
      </g>
      <path d="M300 165 L 420 250 L 360 365 L 235 300 Z" fill="#d2fbff" opacity="0.82"/>
      <path d="M300 50 L 305 120 L 421 252 L 294 386 L 180 160 Z" fill="#9fe5ff" opacity="0.3"/>
      <path d="M266 40 L 176 143 L 232 312 L 322 240 Z" fill="#dffcff" opacity="0.7"/>
      <path d="M315 50 L 420 177 L 346 320 L 251 254 Z" fill="#9ae6ff" opacity="0.9"/>
    </g>

    <g transform="translate(790 440)">
      <path d="M158 30 C 132 76, 126 110, 130 142 C 177 178, 210 200, 248 216 C 276 189, 288 146, 286 104 C 278 73, 238 36, 158 30 Z" fill="#1d2e48" opacity="0.85"/>
      <path d="M155 24 C 138 46, 120 64, 126 128 C 150 140, 185 152, 225 164 C 246 132, 258 104, 260 74 C 246 48, 210 28, 155 24 Z" fill="#8af7d9" opacity="0.9"/>
      <g filter="url(#softGlow)">
        <ellipse cx="190" cy="118" rx="80" ry="52" fill="#8affd0" opacity="0.9"/>
      </g>
      <g fill="#0e1d2e" opacity="0.85">
        <path d="M148 160 L 222 164 L 242 208 L 186 214 Z"/>
        <path d="M118 120 L 170 140 L 160 182 L 114 172 Z"/>
        <path d="M210 152 L 264 144 L 272 192 L 222 200 Z"/>
      </g>
      <g opacity="0.8">
        <path d="M200 74 C 224 108, 203 143, 188 170" stroke="#4ef0b3" stroke-width="10" fill="none"/>
      </g>
    </g>

    <g filter="url(#bigGlow)">
      <path d="M500 1230 C 680 1060, 840 1080, 980 1210 L 980 1340 C 820 1238, 690 1245, 500 1372 Z" fill="#ff4d2d" opacity="0.4"/>
      <path d="M200 1300 C 420 1180, 500 1224, 560 1260 C 610 1205, 740 1150, 970 1225 L 1000 1400 C 860 1370, 720 1398, 600 1468 C 448 1538, 315 1540, 200 1470 Z" fill="#ff4a2f" opacity="0.42"/>
    </g>

    <g fill="none" stroke="#ff7a40" stroke-linecap="round" stroke-width="22" opacity="0.7">
      <path d="M310 1330 C 420 1245, 500 1220, 540 1230"/>
      <path d="M690 1228 C 780 1170, 842 1160, 930 1208"/>
      <path d="M560 1420 C 630 1370, 720 1350, 800 1398"/>
    </g>
  </g>

  <g>
    <text x="600" y="190" text-anchor="middle" font-size="62" font-family="Georgia, 'Times New Roman', serif" letter-spacing="8" fill="#edf3ff" opacity="0.95">PHILIP A. HUGHES</text>
  </g>

  <g>
    <text x="600" y="1060" text-anchor="middle" font-size="270" font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="url(#gold)" letter-spacing="-10">SEAT</text>
    <text x="600" y="1290" text-anchor="middle" font-size="255" font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="url(#gold)" letter-spacing="-8">OF</text>
    <text x="600" y="1585" text-anchor="middle" font-size="250" font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="url(#gold)" letter-spacing="-8">EMBERS</text>
  </g>

  <g>
    <text x="600" y="1690" text-anchor="middle" font-size="54" font-family="Georgia, 'Times New Roman', serif" letter-spacing="8" fill="#f4e5b3">THE KOLIJAR CHRONICLES</text>
    <text x="600" y="1758" text-anchor="middle" font-size="46" font-family="Georgia, 'Times New Roman', serif" letter-spacing="12" fill="#f3d792">BOOK ONE</text>
  </g>
</svg>
